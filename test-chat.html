<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba Chat Autenticado - EcoHomeStore</title>
</head>
<body>
  <h2>Chat EcoHomeStore (Prueba JWT + Persistencia)</h2>
  
  <div>
    <input type="text" id="mensaje" placeholder="Escribe un mensaje..." />
    <button onclick="enviarMensaje()">Enviar Mensaje</button>
  </div>

  <h3>Historial de Mensajes:</h3>
  <ul id="listaMensajes"></ul>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    
    // TOKEN JWT OBTENIDO
    const tokenJWT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MSwidXNlcm5hbWUiOiJBbmRlcnNvbiJ9.h_Yhy_p0k8tnP551l_BcsgmhZT1gjRpAUKvkOXdPFM0";

    // Conexión autenticada enviando el token en el handshake
    const socket = io('http://localhost:3000', {
      auth: { token: tokenJWT }
    });

    socket.on('connect', () => {
      console.log('Conectado exitosamente con ID:', socket.id);
    });

    socket.on('connect_error', (err) => {
      console.error('Error de autenticación:', err.message);
    });

    // Escuchar el mensaje devuelto desde PostgreSQL
    socket.on('receive-message', (data) => {
      const li = document.createElement('li');
      li.innerHTML = `<strong>${data.username}:</strong> ${data.text} <small>(${new Date(data.created_at).toLocaleTimeString()})</small>`;
      document.getElementById('listaMensajes').appendChild(li);
    });

    function enviarMensaje() {
      const input = document.getElementById('mensaje');
      if (input.value.trim() !== '') {
        socket.emit('new-message', input.value);
        input.value = '';
      }
    }
  </script>
</body>
</html>
